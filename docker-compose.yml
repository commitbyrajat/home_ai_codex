services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:1.106.1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\",timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  neo4j:
    image: neo4j:5.26.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-demodemo}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:standalone
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demodemo}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-main}
      SEMAPHORE_LIMIT: ${SEMAPHORE_LIMIT:-10}
      CONFIG_PATH: /app/mcp/config/config.yaml
      MODEL_NAME: graphiti-extract
      EMBEDDER_MODEL: memory-embed
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      OPENAI_API_URL: http://litellm:4000/v1
      OPENSSL_armcap: "0"
    volumes:
      - ./graphiti/config-docker-neo4j.yaml:/app/mcp/config/config.yaml:ro

  gemini-search:
#    profiles: ["codex"]
    platform: linux/amd64
    image: gemini-search-mcp:codex
    build:
      context: ./gemini-search
      dockerfile: Dockerfile
    command: ["python", "/opt/gemini-search/http_server.py"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:6080:6080"
    shm_size: "2gb"
    environment:
      PYTHONUNBUFFERED: "1"
      HEADLESS: "0"
      BROWSER_CHANNEL: chromium
      GEMINI_SEARCH_USER_DATA_DIR: /app/browser-profile
    volumes:
      - gemini-browser-profile:/app/browser-profile

volumes:
  gemini-browser-profile:
  neo4j_data:
  neo4j_logs:
